<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white m-0 min-h-screen">
    <header class="bg-gray-800 border-b border-gray-700 p-5 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-500">PopcornCine</h1>
      <nav>
        <a href="index.html" class="text-gray-300 font-semibold hover:text-white ml-6">Home</a>
        <a href="account.html"class="text-gray-300 font-semibold hover:text-white ml-6">Login/Register</a>
      </nav>
    </header>
    <main class="max-w-3xl mx-auto p-4 sm:p-8">
        <div id="movieDetails" class="bg-gray-800 p-5"></div>
        <div id="showtimeContainer" class="bg-gray-800 p-5 rounded-md"></div>
        <div id="bookingSection" class="bg-gray-800 p-4 mt-4">
            <h3 class="text-white text-lg font-bold">Select Tickets</h3>
            <div class="mt-4">
                <label for="ticketQty" class="text-white">Quantity:</label>
                <input type="number" id="ticketQty" min="1" max="10" value="1" class="bg-gray-600 text-white p-2 m-2">
                <button id="reviewBtn" class="bg-blue-500 text-white p-2 mt-2 hover:bg-blue-600">Review Booking</button>
            </div>
        </div>
    </main>
    
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get("id");
        try {
          const res = await fetch(`/movies/${movieId}`, {
            method: "GET",
            headers: { "Content-Type": "application/json" },
          });
          const movie = await res.json();
          if (res.ok) {
            const container = document.getElementById("movieDetails");
            container.innerHTML = `
              <div class="flex flex-col sm:flex-row gap-5">
                <img src="${movie.ImageURL}" alt="${movie.Title}" class="w-full sm:w-1/3 h-80 object-contain rounded-md bg-gray-800">
                <div class="w-full sm:w-2/3">
                  <div>
                    <h2 class="text-3xl font-bold text-white mb-2">${movie.Title}</h2>
                    <p class="text-sm text-gray-400 mb-2">${movie.Genre}</p>
                    <p class="text-sm text-gray-400 mb-2">${movie.Duration} mins</p>
                    <p class="text-sm font-semibold text-green-400 mb-4">Rating: ${movie.Rating}</p>
                    <p class="text-sm text-gray-300 leading-relaxed mb-4">${movie.Description}</p>
                  </div>
                </div>
              </div>
            `;
          } else {
            alert(movie.error || "Failed to load movie details.");
          }
        } catch (error) {
          console.error("Fetch error:", error);
          document.getElementById("movieDetails").innerHTML = `<p class="text-red-500 font-bold text-center">Server connection failed.</p>`;
        }

        try {
          const stRes = await fetch(`/showtimes/movie/${movieId}`);
          const showtimes = await stRes.json();      
          if (stRes.ok && showtimes.length > 0) {
            const stContainer = document.getElementById("showtimeContainer");
            stContainer.innerHTML = `<h3 class="text-xl font-bold text-white mb-3">Select Showtime</h3><div>`;     
            showtimes.forEach(st => {
              stContainer.innerHTML += `<button id="stBtn_${st.ShowtimeID}" class="stBtn bg-gray-700 hover:bg-green-500 text-white py-2 px-4 m-4">${st.ShowDate.split("T")[0]} | ${st.StartTime.split("T")[1].substring(0, 5)} | ${st.Screen}</button>`;
            });     
            stContainer.innerHTML+= `</div>`;
            const button = document.querySelectorAll(".stBtn");
            button.forEach(btn=> {
              btn.addEventListener('click', function() {
                button.forEach(b => {
                  b.classList.remove('bg-green-500');
                  b.classList.add('bg-gray-700');
                });
                this.classList.remove('bg-gray-700');
                this.classList.add('bg-green-500');
                window.selectedShowtimeId = this.id.split('_')[1];
              });
            })
          } else {
            document.getElementById("showtimeContainer").innerHTML = `<p class="text-red-400">No showtimes available.</p>`;
          }
        } catch (error) {
          document.getElementById("showtimeContainer").innerHTML = `<p class="text-red-500 font-bold">Failed to load showtimes.</p>`;
        }
      });
    </script>
</body>
</html>
