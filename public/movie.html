<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white m-0 min-h-screen">
    <header class="bg-gray-800 border-b border-gray-700 p-5 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-500">PopcornCine</h1>
      <nav>
        <a href="index.html" class="text-gray-300 font-semibold hover:text-white ml-6">Home</a>
        <a href="account.html" id="authCheck" class="text-gray-300 font-semibold hover:text-white ml-6">Login/Register</a>
      </nav>
    </header>
    <main class="max-w-3xl mx-auto p-4 sm:p-8">
        <div id="movieDetails" class="bg-gray-800 p-5"></div>
        <div id="showtimeContainer" class="bg-gray-800 p-5 rounded-md"></div>
        <div id="bookingSection" class="hidden bg-gray-800 p-4 mt-4">
            <h3 class="text-white text-lg font-bold">Select Tickets</h3>
            <div class="mt-4">
                <label for="ticketQty" class="text-white">Quantity:</label>
                <input type="number" id="ticketQty" min="1" max="10" value="1" class="bg-gray-600 text-white p-2 m-2">
                <button id="reviewBtn" class="bg-blue-500 text-white p-2 mt-2 hover:bg-blue-600">Review Booking</button>
            </div>
        </div>
    </main>
    <div id="reviewBooking" class="hidden fixed top-0 left-0 w-full h-full bg-gray-900 pt-20 z-50">
      <div class="bg-gray-800 p-4 mx-auto w-80 border border-gray-500 text-center">
          <h2 class="text-white text-xl font-bold">Invoice Review</h2>
          <div id="popupContent" class="text-white mt-4 mb-4"></div>
          <div>
              <button id="cancelBtn" class="bg-gray-500 text-white p-2 m-2">Cancel</button>
              <button id="confirmBtn" class="bg-green-500 text-white p-2 m-2">Confirm & Pay</button>
          </div>
      </div>
    </div>
    <script>
        const authCheck = document.getElementById("authCheck");
        const userToken = localStorage.getItem("token");
        if (userToken) {
          authCheck.innerText = "Logout";
          authCheck.href = "#";
          authCheck.addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("token");
            alert("You have been logged out.");
            window.location.reload();
          });
        }
        document.addEventListener("DOMContentLoaded", async () => {
          const urlParams = new URLSearchParams(window.location.search);
          const movieId = urlParams.get("id");
          const price = 15.00;
          try {
            const res = await fetch(`/movies/${movieId}`, {
              method: "GET",
              headers: { "Content-Type": "application/json" },
            });
            const movie = await res.json();
            if (res.ok) {
              window.movieTitle = movie.Title;
              const container = document.getElementById("movieDetails");
              container.innerHTML = `
          <div class="flex flex-col sm:flex-row gap-5">
            <img src="${movie.ImageURL}" alt="${movie.Title}" class="w-full sm:w-1/3 h-80 object-contain rounded-md bg-gray-800">
            <div class="w-full sm:w-2/3">
              <div>
                <h2 class="text-3xl font-bold text-white mb-2">${movie.Title}</h2>
                <p class="text-sm text-gray-400 mb-2">${movie.Genre}</p>
                <p class="text-sm text-gray-400 mb-2">${movie.Duration} mins</p>
                <p class="text-sm font-semibold text-green-400 mb-4">Rating: ${movie.Rating}</p>
                <p class="text-sm text-gray-300 leading-relaxed mb-4">${movie.Description}</p>
              </div>
            </div>
          </div>
        `;
            } else {
              alert(movie.error || "Failed to load movie details.");
            }
          } catch (error) {
            console.error("Fetch error:", error);
            document.getElementById("movieDetails").innerHTML = `<p class="text-red-500 font-bold text-center">Server connection failed.</p>`;
          }

          try {
            const stRes = await fetch(`/showtimes/movie/${movieId}`);
            const showtimes = await stRes.json();
            if (stRes.ok && showtimes.length > 0) {
              const stContainer = document.getElementById("showtimeContainer");
              stContainer.innerHTML = `<h3 class="text-xl font-bold text-white mb-3">Select Showtime</h3><div>`;
              showtimes.forEach(st => {
                stContainer.innerHTML += `<button id="stBtn_${st.ShowtimeID}" class="stBtn bg-gray-700 hover:bg-green-500 text-white py-2 px-4 m-4">${st.ShowDate.split("T")[0]} | ${st.StartTime.split("T")[1].substring(0, 5)} | ${st.Screen}</button>`;
              });
              stContainer.innerHTML += `</div>`;
              const button = document.querySelectorAll(".stBtn");
              button.forEach(btn => {
                btn.addEventListener('click', function () {
                  button.forEach(b => {
                    b.classList.remove('bg-green-500');
                    b.classList.add('bg-gray-700');
                  });
                  this.classList.remove('bg-gray-700');
                  this.classList.add('bg-green-500');
                  window.selectedShowtimeId = this.id.split('_')[1];
                  window.showTime = this.innerText;
                  document.getElementById("bookingSection").classList.remove('hidden');
                });
              })
            } else {
              document.getElementById("showtimeContainer").innerHTML = `<p class="text-red-400">No showtimes available.</p>`;
            }
          } catch (error) {
            document.getElementById("showtimeContainer").innerHTML = `<p class="text-red-500 font-bold">Failed to load showtimes.</p>`;
          }
          const reviewBtn = document.getElementById("reviewBtn");
          const reviewBooking = document.getElementById("reviewBooking");
          const popupContent = document.getElementById("popupContent");
          const cancelBtn = document.getElementById("cancelBtn");
          const confirmBtn = document.getElementById("confirmBtn");

          reviewBtn.addEventListener('click', () => {
            const qty = document.getElementById("ticketQty").value;
            const totalPrice = (qty * price).toFixed(2);
            window.cTotalAmount = totalPrice;

            popupContent.innerHTML = `
        <p class="mb-2"><span class="text-gray-400">Movie:</span> ${window.movieTitle}</p>
        <p class="mb-2"><span class="text-gray-400">Time:</span> ${window.showTime}</p>
        <p class="mb-2"><span class="text-gray-400">Tickets:</span> ${qty}</p>
        <p class="mt-4 text-green-400 font-bold text-xl">Total: $${totalPrice}</p> 
      `;

            reviewBooking.classList.remove('hidden');
          });
          cancelBtn.addEventListener('click', () => {
            reviewBooking.classList.add('hidden');
          });

          confirmBtn.addEventListener('click', async () => {
            const token = localStorage.getItem("token");
            if (!token) {
              alert("Please Login To Purchase");
              window.location.href = "account.html";
              return;
            }
            const qty = parseInt(document.getElementById("ticketQty").value);
            try {
              confirmBtn.innerText = "Processing...";
              confirmBtn.disabled = true;
              const res = await fetch('/bookings', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                  showtimeId: window.selectedShowtimeId,
                  quantity: qty,
                  totalAmount: window.cTotalAmount
                })
              });
              if (res.ok) {
                popupContent.innerHTML = `
              <h3 class="text-green-400 font-bold text-2xl mb-4">Booking Confirmed!</h3>
              <p>Tickets successfully booked.</p>
              <p class="mt-2 text-gray-300">Invoice Sent To Your Email.</p>
            `;
                confirmBtn.style.display = "none";
                cancelBtn.innerText = "Close";
                cancelBtn.classList.replace('bg-gray-500', 'bg-blue-500');

              } else {
                const errMsg = await res.json();
                alert(errMsg.error);
                confirmBtn.innerText = "Confirm & Pay";
                confirmBtn.disabled = false;
              }
            } catch (error) {
              console.error("Booking Error:", error);
              alert("An error occurred while connecting to the server.");
              confirmBtn.innerText = "Confirm & Pay";
              confirmBtn.disabled = false;
            }
          });
        });
    </script>
</body>
</html>
