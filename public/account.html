<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started — Sign In or Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 w-full max-w-lg rounded-xl shadow-lg">
        <div class="flex mb-6">
            <button id="loginBtn" class="bg-cyan-700 w-1/2 py-2 text-white border-2 border-black font-bold rounded-l-xl">Login</button>
            <button id="registerBtn" class="bg-silver-600 w-1/2 py-2 text-black border-2 border-black font-bold rounded-r-xl">Register</button>
        </div>

        <div id="login" class="hidden">
            <h3 class="text-2xl font-bold text-center mb-6">Welcome back!</h3>
            <input type="email" placeholder="Email" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input type="password" placeholder="Password" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <button class="w-full bg-cyan-700 text-white py-2 rounded-xl hover:bg-cyan-500">Login</button>
        </div>

        <div id="register">
            <h3 class="text-2xl font-bold text-center mb-6">Account Registration</h3>
            <input type="text" placeholder="Name" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input type="email" placeholder="Email" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input type="password" placeholder="Password" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input type="password" placeholder="Confirm Password" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <button class="w-full bg-cyan-700 text-white py-2 rounded-xl hover:bg-cyan-500">Login</button>
        </div>

    </div>
    <script>
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");

    </script>
    <script src="account.js"></script>
</body>
</html>
