<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started — Sign In or Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 w-full max-w-lg rounded-xl shadow-lg">
        <div class="flex mb-6">
            <button id="loginBtn" class="bg-cyan-700 w-1/2 py-2 text-white border-2 border-black font-bold rounded-l-xl">Login</button>
            <button id="registerBtn" class="bg-silver-600 w-1/2 py-2 text-black border-2 border-black font-bold rounded-r-xl">Register</button>
        </div>

        <div id="login">
            <h3 class="text-2xl font-bold text-center mb-6">Welcome back!</h3>
            <input id="loginEmail" type="email" placeholder="Email" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input id="loginPassword" type="password" placeholder="Password" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <button id="submitLogin" class="w-full bg-cyan-700 text-white py-2 rounded-xl hover:bg-cyan-500">Login</button>
        </div>

        <div id="register" class="hidden">
            <h3 class="text-2xl font-bold text-center mb-6">Account Registration</h3>
            <input id="registerName" type="text" placeholder="Name" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input id="registerEmail" type="email" placeholder="Email" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input id="registerPassword" type="password" placeholder="Password" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <input id="registerConfirm" type="password" placeholder="Confirm Password" class="w-full py-2 border border-gray-500 rounded-lg px-3 mb-5">
            <button id="submitRegister" class="w-full bg-cyan-700 text-white py-2 rounded-xl hover:bg-cyan-500">Register</button>
        </div>

    </div>
    <script>
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");
        const loginForm = document.getElementById("login");
        const registerForm = document.getElementById("register");

        loginBtn.addEventListener("click", ()=>{
            registerForm.classList.add("hidden");
            loginForm.classList.remove("hidden");
            registerBtn.classList.remove("bg-cyan-700","text-white");
            loginBtn.classList.add("bg-cyan-700","text-white");

        });

        registerBtn.addEventListener("click", ()=>{
            registerForm.classList.remove("hidden");
            loginForm.classList.add("hidden");
            loginBtn.classList.remove("bg-cyan-700","text-white");
            registerBtn.classList.add("bg-cyan-700","text-white");
        });
        
        //Register Submit Button
        document.getElementById("submitRegister").addEventListener("click",async()=>{
            const name = document.getElementById("registerName").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;
            const confirmPassword = document.getElementById("registerConfirm").value;

            if(password !==confirmPassword){
                return alert("Password Not Match!");
            }

            try{
                const res = await fetch('/users/register',{
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({name: name, email: email, password: password, role:"Customer"})
                });
                const data = await res.json();
                if(res.ok){
                    alert("Registration succussful!");
                    document.getElementById('registerName').value = '';
                    document.getElementById('registerEmail').value = '';
                    document.getElementById('registerPassword').value = '';
                    document.getElementById('registerConfirm').value = '';
                    document.getElementById('loginBtn').click();
                }else{
                    alert(data.message);
                }

            }catch(error){
                alert("Registration failed.")
            }
        })

        //Login Submit Button
        document.getElementById("submitLogin").addEventListener('click',async()=>{
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try{
                const res = await fetch('/login',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({email:email,password:password})
                });
                const data = await res.json();
                if(res.ok){
                    alert('Successfully Login');
                    document.getElementById('loginPassword').value='';
                    document.getElementById('loginEmail').value='';
                    window.location.href='/index.html'
                }else{
                alert(data.message);
                }
            }catch(error){
                alert("Server Down Try Again Later.");
            }
        })

    </script>
    <script src="account.js"></script>
</body>
</html>
